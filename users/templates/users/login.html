{% extends "base.html" %}
{% load i18n %}

{% block title %}{% trans "Вход — DevLearn" %}{% endblock %}

{% block content %}
<h1>{% trans "Вход" %}</h1>
<form method="post" class="form-styled">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn-primary">{% trans "Войти" %}</button>
</form>
<p>{% trans "Нет аккаунта?" %} <a href="{% url 'users:register' %}">{% trans "Регистрация" %}</a></p>
{% endblock %}
