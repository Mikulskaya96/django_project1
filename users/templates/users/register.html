{% extends "base.html" %}
{% load i18n %}

{% block title %}{% trans "Регистрация — DevLearn" %}{% endblock %}

{% block content %}
<h1>{% trans "Регистрация" %}</h1>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn-primary">{% trans "Зарегистрироваться" %}</button>
</form>
<p>{% trans "Уже есть аккаунт?" %} <a href="{% url 'users:login' %}">{% trans "Войти" %}</a></p>
{% endblock %}
