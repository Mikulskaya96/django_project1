# Локальная разработка: Django + PostgreSQL (как на Render по смыслу).
# Redis убран — в коде приложения не используется (меньше RAM).
# Продакшен на Render идёт через render.yaml + gunicorn, не через этот compose.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: devlearn
      POSTGRES_USER: devlearn
      POSTGRES_PASSWORD: devlearn
    volumes:
      - devlearn_db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devlearn -d devlearn"]
      interval: 3s
      timeout: 5s
      retries: 15
      start_period: 5s

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_DEBUG: "True"
      DATABASE_URL: "postgres://devlearn:devlearn@db:5432/devlearn"

volumes:
  devlearn_db_data:
